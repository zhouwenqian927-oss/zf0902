name: menu-fetch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          curl -fsSL --retry 3 --retry-delay 3 --max-time 40 -o menu.html "https://ea606bf8988673.lhr.life/menu.html"
          ls -l menu.html
      - name: Commit
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.html
          git commit -m "publish menu page [skip ci]"
          git push
