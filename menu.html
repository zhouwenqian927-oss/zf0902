<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0">
<title>今晚菜单 · 你点，我做</title>
<style>
:root{
  --bg:#faf6f0;
  --bg-soft:#f4ede4;
  --card:#fffdfa;
  --ink:#2b2320;
  --muted:#8b7e73;
  --line:rgba(43,35,32,.10);
  --line-strong:rgba(43,35,32,.16);
  --accent:#bf5a40;
  --accent-deep:#a2452d;
  --accent-soft:#f6e2da;
  --green:#6d8a61;
  --green-soft:#e6efe0;
  --gold:#b58a3e;
  --shadow:0 10px 30px rgba(92,62,42,.07);
  --shadow-sm:0 2px 8px rgba(92,62,42,.05);
  --bar:rgba(250,246,240,.86);
}
html[data-theme="dark"]{
  --bg:#171412;
  --bg-soft:#1e1a17;
  --card:#221d19;
  --ink:#f3ece5;
  --muted:#a2968a;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --accent:#e28367;
  --accent-deep:#f0a089;
  --accent-soft:#3a2722;
  --green:#a3c097;
  --green-soft:#28332a;
  --gold:#d3ab63;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.28);
  --bar:rgba(23,20,18,.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
ol,ul{margin:0;padding:0;list-style:none}
::selection{background:var(--accent-soft);color:var(--ink)}
.serif{font-family:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif}

.app{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:0 18px calc(96px + env(safe-area-inset-bottom));
  position:relative;
}
.bg-veil{
  position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(120% 60% at 82% -8%,rgba(191,90,64,.10),transparent 62%),
    radial-gradient(90% 50% at 0% 0%,rgba(181,138,62,.07),transparent 60%);
}
html[data-theme="dark"] .bg-veil{
  background:
    radial-gradient(120% 60% at 82% -8%,rgba(226,131,103,.10),transparent 62%),
    radial-gradient(90% 50% at 0% 0%,rgba(211,171,99,.05),transparent 60%);
}

/* ---------- hero ---------- */
.hero{padding:26px 0 6px;position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--accent);opacity:.7}
.theme-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:transform .2s ease,color .2s,border-color .2s;
}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:17px;height:17px}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero-copy{min-width:0}
.hero h1{
  font-size:32px;line-height:1.28;font-weight:600;letter-spacing:.01em;
}
.hero h1 span{color:var(--accent);display:block}
.hero-sub{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.02em}
.bowl{width:104px;flex:0 0 104px;margin-bottom:2px;opacity:.92}
.bowl svg{width:100%;height:auto;display:block}
.steam{animation:steam 3.6s ease-in-out infinite}
.steam:nth-child(2){animation-delay:.9s}
.steam:nth-child(3){animation-delay:1.8s}
@keyframes steam{
  0%{opacity:.25;transform:translateY(4px)}
  50%{opacity:.85;transform:translateY(-3px)}
  100%{opacity:.25;transform:translateY(4px)}
}

/* ---------- random entry ---------- */
.pick{
  margin:22px 0 20px;width:100%;
  display:flex;align-items:center;gap:14px;
  padding:15px 16px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  text-align:left;transition:transform .18s ease,border-color .2s;
}
.pick:active{transform:scale(.985)}
.pick-icon{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent-deep);
}
.pick-icon svg{width:18px;height:18px}
.pick-txt{flex:1;min-width:0}
.pick-txt b{display:block;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.pick-txt small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.pick-arrow{color:var(--muted);flex:0 0 auto}
.pick-arrow svg{width:16px;height:16px}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:20;
  padding:10px 0 10px;margin:0 -18px;padding-left:18px;padding-right:18px;
  background:var(--bar);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.toolbar.stuck{border-bottom-color:var(--line)}
.search{
  display:flex;align-items:center;gap:9px;
  height:44px;padding:0 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);
  transition:border-color .2s,box-shadow .2s;
}
.search:focus-within{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:17px;height:17px;flex:0 0 17px;color:var(--muted)}
.search input{
  flex:1;min-width:0;border:none;outline:none;background:none;
  font-size:14px;height:100%;
}
.search input::placeholder{color:var(--muted)}
.clear-q{
  width:26px;height:26px;border-radius:50%;flex:0 0 26px;
  display:none;align-items:center;justify-content:center;
  color:var(--muted);background:var(--bg-soft);
}
.clear-q.show{display:flex}
.clear-q svg{width:13px;height:13px}

.chip-row{
  display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);
  font-size:13px;color:var(--muted);white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .18s ease;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.chip.on .dot{opacity:.8}
.chip.sub{height:30px;padding:0 12px;font-size:12px;background:transparent}
.chip.sub.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-deep);font-weight:500}
.chip-row.filters{padding-top:8px;padding-bottom:4px}

/* ---------- list ---------- */
.result-meta{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;padding:14px 2px 10px;
  font-size:12px;color:var(--muted);letter-spacing:.02em;
}
.result-meta b{color:var(--ink);font-weight:600}
.group-title{
  display:flex;align-items:baseline;gap:8px;
  padding:18px 2px 10px;
}
.group-title h2{font-size:16px;font-weight:600;letter-spacing:.04em}
.group-title span{font-size:11px;color:var(--muted)}
.group-title::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(-3px)}
.dish{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  margin-bottom:11px;box-shadow:var(--shadow-sm);
  transition:border-color .2s,box-shadow .2s,transform .18s;
  overflow:hidden;
}
.dish.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dish-head{display:flex;gap:12px;align-items:flex-start;padding:15px 15px 14px}
.dish-info{flex:1;min-width:0;cursor:pointer}
.title-line{display:flex;align-items:center;gap:8px;min-width:0}
.title-line h3{
  font-size:17px;font-weight:600;letter-spacing:.01em;line-height:1.4;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.low{
  flex:0 0 auto;font-size:10px;line-height:1;padding:4px 6px;border-radius:5px;
  background:var(--green-soft);color:var(--green);letter-spacing:.06em;font-weight:600;
}
.desc{
  margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
  margin-top:10px;font-size:11.5px;color:var(--muted);
}
.meta .kcal{
  padding:3px 7px;border-radius:6px;background:var(--bg-soft);
  color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;
}
.meta .kcal.g{background:var(--green-soft);color:var(--green)}
.meta .sep{width:1px;height:10px;background:var(--line-strong)}
.add{
  flex:0 0 40px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line-strong);background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);transition:all .18s ease;
}
.add svg{width:16px;height:16px}
.add:active{transform:scale(.9)}
.dish.sel .add{background:var(--accent);border-color:var(--accent);color:#fff}
.dish-body{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1);
}
.dish-body>div{overflow:hidden}
.dish.open .dish-body{grid-template-rows:1fr}
.dish-detail{
  border-top:1px solid var(--line);
  margin:0 15px;padding:13px 0 16px;
}
.field{display:flex;gap:10px;align-items:flex-start}
.field + .field{margin-top:11px}
.field .k{
  flex:0 0 30px;font-size:11px;color:var(--muted);letter-spacing:.1em;
  padding-top:3px;
}
.field .v{flex:1;min-width:0;font-size:12.5px;line-height:1.75;word-break:break-word}
.steps{counter-reset:step}
.steps li{
  counter-increment:step;position:relative;padding-left:20px;
  font-size:12.5px;line-height:1.75;color:var(--ink);
}
.steps li + li{margin-top:5px}
.steps li::before{
  content:counter(step);
  position:absolute;left:0;top:1px;
  width:14px;height:14px;border-radius:50%;
  font-size:9px;line-height:14px;text-align:center;
  background:var(--accent-soft);color:var(--accent-deep);font-weight:600;
}
.more-hint{
  display:flex;justify-content:center;align-items:center;gap:5px;
  padding:0 0 11px;font-size:10.5px;color:var(--muted);letter-spacing:.05em;
}
.more-hint svg{width:11px;height:11px;transition:transform .3s ease}
.dish.open .more-hint{display:none}
.empty{
  text-align:center;padding:56px 20px;color:var(--muted);
}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:600}
.empty p{font-size:12.5px}

/* ---------- bottom bar ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent);
  pointer-events:none;
}
.dock-in{
  max-width:524px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 16px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 8px 28px rgba(60,40,28,.13);
  pointer-events:auto;
  transition:transform .25s ease;
}
.dock-count{flex:1;min-width:0}
.dock-count b{font-size:13.5px;font-weight:600}
.dock-count small{display:block;font-size:11px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-btn{
  flex:0 0 auto;height:42px;padding:0 18px;border-radius:12px;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;letter-spacing:.02em;
  transition:transform .18s ease,opacity .2s;
}
.dock-btn:active{transform:scale(.96)}
.dock-btn[disabled]{opacity:.45}
.dock-btn svg{width:15px;height:15px}

/* ---------- sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(30,24,20,.42);
  opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim.show{opacity:1;visibility:visible}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  max-width:560px;margin:0 auto;
  background:var(--bg);border-radius:24px 24px 0 0;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,.28,1);
  max-height:78vh;display:flex;flex-direction:column;
  box-shadow:0 -12px 40px rgba(40,28,20,.18);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:9px auto 0;flex:0 0 4px}
.sheet-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:14px 20px 10px;
}
.sheet-head h2{font-size:19px;font-weight:600}
.sheet-head p{font-size:11.5px;color:var(--muted);margin-top:2px}
.icon-btn{
  width:34px;height:34px;border-radius:50%;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-soft);color:var(--muted);
}
.icon-btn svg{width:15px;height:15px}
.sheet-list{
  overflow-y:auto;padding:4px 20px 12px;flex:1;min-height:0;
  -webkit-overflow-scrolling:touch;
}
.s-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.s-idx{
  width:24px;height:24px;flex:0 0 24px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-deep);
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.s-name{flex:1;min-width:0}
.s-name b{display:block;font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-name small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.s-rm{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  background:var(--bg-soft);
}
.s-rm svg{width:12px;height:12px}
.s-empty{padding:34px 0 40px;text-align:center;color:var(--muted);font-size:13px}
.s-foot{
  flex:0 0 auto;padding:10px 20px 16px;border-top:1px solid var(--line);
  display:flex;gap:10px;
}
.btn-ghost{
  flex:0 0 auto;height:46px;padding:0 18px;border-radius:13px;
  border:1px solid var(--line-strong);color:var(--muted);font-size:13px;
  background:var(--card);
}
.btn-main{
  flex:1;height:46px;border-radius:13px;background:var(--accent);color:#fff;
  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:.02em;
}
.btn-main:active{transform:scale(.98)}
.btn-main svg{width:16px;height:16px}

/* ---------- random overlay ---------- */
.roll-wrap{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(28,22,18,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.roll-wrap.show{display:flex}
.roll-card{
  width:100%;max-width:330px;background:var(--bg);border-radius:26px;
  padding:28px 24px 22px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.28);
  animation:pop .38s cubic-bezier(.2,.9,.3,1.3);
  position:relative;
}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.roll-eyebrow{font-size:10.5px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.roll-plate{
  width:74px;height:74px;margin:18px auto 12px;border-radius:50%;
  border:1px solid var(--line-strong);position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);
}
.roll-plate::after{
  content:"";position:absolute;inset:11px;border-radius:50%;
  border:1px dashed var(--line-strong);
  animation:spin 8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.roll-plate svg{width:30px;height:30px;color:var(--accent)}
.roll-name{
  font-size:27px;line-height:1.35;font-weight:600;min-height:37px;
  letter-spacing:.02em;
}
.roll-name.rolling{opacity:.55;filter:blur(.4px)}
.roll-desc{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:20px;line-height:1.6}
.roll-meta{
  display:flex;justify-content:center;gap:7px;flex-wrap:wrap;
  margin-top:12px;font-size:11px;color:var(--muted);
}
.roll-meta span{padding:3px 8px;border-radius:6px;background:var(--bg-soft)}
.roll-meta .g{background:var(--green-soft);color:var(--green)}
.roll-actions{display:flex;gap:9px;margin-top:22px}
.roll-actions button{
  flex:1;height:44px;border-radius:12px;font-size:13px;font-weight:500;
  border:1px solid var(--line-strong);color:var(--ink);background:var(--card);
}
.roll-actions .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.roll-actions .go[disabled]{opacity:.45}
.roll-close{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  background:var(--bg-soft);
}
.roll-close svg{width:13px;height:13px}
.roll-card.reveal .roll-name{animation:namein .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes namein{0%{opacity:.2;transform:scale(.92)}100%{opacity:1;transform:none}}

/* ---------- manual copy fallback ---------- */
.copy-wrap{
  position:fixed;inset:0;z-index:85;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(28,22,18,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.copy-wrap.show{display:flex}
.copy-card{
  width:100%;max-width:340px;background:var(--bg);border-radius:22px;
  padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.28);
  animation:pop .3s cubic-bezier(.2,.9,.3,1.3);
}
.copy-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.copy-head h3{font-size:17px;font-weight:600}
.copy-head button{
  width:28px;height:28px;border-radius:50%;flex:0 0 28px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:var(--bg-soft);
}
.copy-head svg{width:12px;height:12px}
.copy-card p{font-size:12px;color:var(--muted);margin-top:6px}
.copy-card textarea{
  width:100%;height:158px;margin-top:12px;padding:12px;
  border-radius:12px;border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink);
  font-size:13px;line-height:1.7;resize:none;outline:none;
  word-break:break-word;
}
.copy-actions{display:flex;margin-top:12px}
.copy-actions button{
  flex:1;height:42px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:13px;font-weight:600;
}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:90;
  background:var(--ink);color:var(--bg);font-size:12.5px;
  padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;
  box-shadow:0 8px 22px rgba(0,0,0,.22);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.lock{overflow:hidden}

@media (min-width:600px){
  .app{padding-left:24px;padding-right:24px}
  .hero h1{font-size:37px}

['虾仁滑蛋','light',165,12,'咸鲜','简单','嫩到会抖的蛋，配虾仁刚刚好。','虾仁 150g / 鸡蛋 3个 / 牛奶 15ml',['虾仁去虾线，用盐和料酒腌5分钟。','鸡蛋加牛奶和一小撮盐打散。','热锅冷油先把虾仁滑至变色盛出，倒蛋液小火推炒到半凝固，回虾仁翻两下立刻关火。']],

['西葫芦炒蛋','light',130,12,'清淡','简单','家常得不能再家常，却很下饭。','西葫芦 1个 / 鸡蛋 3个 / 蒜',['西葫芦切薄片，鸡蛋加少许盐打散。','热锅炒蛋至凝固盛出。','蒜末炒香下西葫芦，中火炒3分钟至变软，回鸡蛋翻匀，撒盐出锅。']],

['杨枝甘露','morning',260,25,'香甜','简单','芒果和西柚，港式甜品那味儿。','芒果 2个 / 西柚 半个 / 椰奶 200ml / 西米',['西米煮至透明，过冷水。','芒果一半打泥，一半切丁，西柚剥粒。','椰奶、芒果泥和西米拌匀，铺芒果丁和西柚。']],

['现磨豆浆','morning',80,20,'清甜','简单','自己打的豆浆，豆香很足。','黄豆 80g / 水 1000ml',['黄豆提前泡8小时。','加1000ml水用破壁机打细。','过滤后煮沸5分钟，按口味加糖。']],
['鸡蛋灌饼','morning',350,25,'咸香','简单','路边摊的味道，自己也能复刻。','手抓饼 1张 / 鸡蛋 2个 / 生菜 / 火腿',['手抓饼小火煎至鼓起。','划开小口灌入打散的鸡蛋。','两面煎熟，夹生菜和火腿。']],
];

const CAT = {
  light:  {name:'减脂低卡', order:0},
  home:   {name:'家常热菜', order:1},
  soup:   {name:'汤羹',     order:2},
  staple: {name:'主食面点', order:3},
  cold:   {name:'凉菜快手', order:4},
  morning:{name:'早餐甜点', order:5}
};

const DISHES = RAW.map(function(r, i){
  return {
    id:i, n:r[0], c:r[1], k:r[2], t:r[3], f:r[4], lv:r[5],
    d:r[6], ing:r[7], s:r[8], light:r[1]==='light'
  };
});

const $ = function(sel, root){ return (root||document).querySelector(sel); };
const $$ = function(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); };

const STORE_KEY = 'menu:selected:v1';
const THEME_KEY = 'menu:theme';

let selected = [];
try{
  var rawSel = localStorage.getItem(STORE_KEY);
  if(rawSel){
    var arr = JSON.parse(rawSel);
    if(Array.isArray(arr)) selected = arr.filter(function(n){ return typeof n === 'number' && n >= 0 && n < DISHES.length; });
  }
}catch(e){}

const filter = { cat:'all', q:'', light:false, quick:false, time:'all' };
const expanded = new Set();

function saveSelected(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(selected)); }catch(e){}
}
function byId(id){ return DISHES[id]; }
function isSelected(id){ return selected.indexOf(id) !== -1; }
function kcalSum(){
  return selected.reduce(function(sum, id){ return sum + byId(id).k; }, 0);
}

/* ---------- filters ---------- */
function matches(d){
  if(filter.cat !== 'all' && d.c !== filter.cat) return false;
  if(filter.light && d.c !== 'light') return false;
  if(filter.quick && d.t > 30) return false;
  if(filter.time === '15' && d.t > 15) return false;
  if(filter.time === '30' && d.t > 30) return false;
  if(filter.time === 'long' && d.t <= 30) return false;
  if(filter.q){
    var q = filter.q.toLowerCase();
    var hay = (d.n + ' ' + d.d + ' ' + d.f + ' ' + d.lv + ' ' + d.ing + ' ' + d.s.join(' ')).toLowerCase();
    if(hay.indexOf(q) === -1) return false;
  }
  return true;
}

function renderList(){
  var list = $('#list');
  var items = DISHES.filter(matches);

  $('#countNum').textContent = items.length;
  updateSelHint();

  if(!items.length){
    list.innerHTML = '<div class="empty"><b>没找到这道菜</b><p>换个关键字，或清掉筛选试试</p></div>';
    return;
  }

  var html = '';
  var lastCat = null;
  items.forEach(function(d){
    var showHead = filter.q === '' && d.c !== lastCat;
    if(showHead){
      html += '<div class="group-title"><h2 class="serif">' + CAT[d.c].name + '</h2><span>' + countCat(d.c) + ' 道</span></div>';
      lastCat = d.c;
    }
    html += cardHTML(d);
  });
  list.innerHTML = html;
}

function countCat(cat){
  return DISHES.filter(function(d){ return d.c === cat; }).length;
}

function cardHTML(d){
  var sel = isSelected(d.id);
  var open = expanded.has(d.id);
  var kcalClass = d.light ? 'kcal g' : 'kcal';
  var low = d.light ? '<span class="low">低卡</span>' : '';
  var steps = d.s.map(function(s){ return '<li>' + s + '</li>'; }).join('');
  return '' +
  '<article class="dish' + (sel ? ' sel' : '') + (open ? ' open' : '') + '" data-id="' + d.id + '">' +
    '<div class="dish-head">' +
      '<div class="dish-info" data-toggle="' + d.id + '">' +
        '<div class="title-line"><h3>' + d.n + '</h3>' + low + '</div>' +
        '<p class="desc">' + d.d + '</p>' +
        '<div class="meta">' +
          '<span class="' + kcalClass + '">' + d.k + ' kcal</span>' +
          '<span class="sep"></span>' +
          '<span>' + d.t + ' 分钟</span>' +
          '<span class="sep"></span>' +
          '<span>' + d.f + '</span>' +
          '<span class="sep"></span>' +
          '<span>' + d.lv + '</span>' +
        '</div>' +
      '</div>' +
      '<button class="add" data-add="' + d.id + '" aria-label="' + (sel ? '从今晚菜单移除' : '加入今晚菜单') + '">' +
        (sel
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m5 12 4.5 4.5L19 7"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>') +
      '</button>' +
    '</div>' +
    '<div class="dish-body"><div>' +
      '<div class="dish-detail">' +
        '<div class="field"><span class="k">食材</span><p class="v">' + d.ing + '</p></div>' +
        '<div class="field"><span class="k">做法</span><ol class="v steps">' + steps + '</ol></div>' +
      '</div>' +
    '</div></div>' +
    '<button class="more-hint" data-toggle="' + d.id + '">' +
      '<span>点开看做法</span>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>' +
    '</button>' +
  '</article>';
}

/* ---------- selection ---------- */
function toggleSelect(id){
  var i = selected.indexOf(id);
  if(i === -1) selected.push(id); else selected.splice(i, 1);
  saveSelected();
  syncCard(id);
  updateSelHint();
  renderSheetIfOpen();
  updateDock();
}

function syncCard(id){
  var el = $('.dish[data-id="' + id + '"]');
  if(!el) return;
  var on = isSelected(id);
  el.classList.toggle('sel', on);
  var btn = $('.add', el);
  if(btn){
    btn.setAttribute('aria-label', on ? '从今晚菜单移除' : '加入今晚菜单');
    btn.innerHTML = on
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m5 12 4.5 4.5L19 7"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>';
  }
}

function updateSelHint(){
  $('#selHint').textContent = selected.length
    ? '今晚菜单 ' + selected.length + ' 道 · 约 ' + kcalSum() + ' kcal'
    : '今晚菜单还没动静';
}

function updateDock(){
  $('#dockTitle').textContent = selected.length ? '今晚菜单 ' + selected.length + ' 道' : '今晚菜单';
  $('#dockSub').textContent = selected.length ? '约 ' + kcalSum() + ' kcal · 点开确认' : '选几道，我照着做';
  $('#openSheet').disabled = false;
}

/* ---------- sheet ---------- */
function renderSheet(){
  var box = $('#sheetList');
  if(!selected.length){
    box.innerHTML = '<div class="s-empty">还没选菜，回去挑几道吧</div>';
    $('#sheetSub').textContent = '空空如也';
    return;
  }
  $('#sheetSub').textContent = selected.length + ' 道 · 约 ' + kcalSum() + ' kcal';
  box.innerHTML = selected.map(function(id, i){
    var d = byId(id);
    return '<div class="s-item">' +
      '<span class="s-idx">' + (i + 1) + '</span>' +
      '<div class="s-name"><b>' + d.n + '</b><small>' + d.k + ' kcal · ' + d.t + ' 分钟 · ' + d.f + '</small></div>' +
      '<button class="s-rm" data-rm="' + id + '" aria-label="移除 ' + d.n + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m5 5 14 14M19 5 5 19"/></svg>' +
      '</button>' +
    '</div>';
  }).join('');
}

function renderSheetIfOpen(){
  if($('#sheet').classList.contains('show')) renderSheet();
}

function openSheet(){
  renderSheet();
  $('#sheet').classList.add('show');
  $('#scrim').classList.add('show');
  $('#sheet').setAttribute('aria-hidden','false');
  document.body.classList.add('lock');
}

function closeSheet(){
  $('#sheet').classList.remove('show');
  $('#scrim').classList.remove('show');
  $('#sheet').setAttribute('aria-hidden','true');
  document.body.classList.remove('lock');
}

/* ---------- copy ---------- */
function menuText(){
  var lines = selected.map(function(id, i){
    var d = byId(id);
    return (i + 1) + '. ' + d.n + '（约 ' + d.k + ' kcal）';
  });
  return '今晚菜单我挑好了：\n' + lines.join('\n') + '\n合计约 ' + kcalSum() + ' kcal。\n你看看还想加点什么？';
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy') ? resolve() : reject(new Error('copy failed')); }
    catch(e){ reject(e); }
    finally{ ta.remove(); }
  });
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1900);
}

/* ---------- random ---------- */
let rollTimer, rollDish = null, rolling = false;

function openRoll(){
  var wrap = $('#rollWrap');
  wrap.classList.add('show');
  document.body.classList.add('lock');
  $('#rollCard').classList.remove('reveal');
  rollDish = null;
  rolling = true;
  $('#rollName').classList.add('rolling');
  $('#rollDesc').textContent = '正在翻菜谱……';
  $('#rollMeta').innerHTML = '';
  $('#rollTake').disabled = true;
  runRoll();
}

function runRoll(){
  clearTimeout(rollTimer);
  var pool = DISHES.filter(function(d){ return !isSelected(d.id); });
  if(!pool.length) pool = DISHES;
  var total = 20, step = 0;
  var nameEl = $('#rollName');
  var tick = function(){
    var d = pool[Math.floor(Math.random() * pool.length)];
    nameEl.textContent = d.n;
    step++;
    if(step < total){
      rollTimer = setTimeout(tick, 55 + step * 13);
    }else{
      revealRoll(d);
    }
  };
  rollTimer = setTimeout(tick, 50);
}

function revealRoll(d){
  rolling = false;
  rollDish = d;
  var card = $('#rollCard');
  card.classList.add('reveal');
  $('#rollName').classList.remove('rolling');
  $('#rollName').textContent = d.n;
  $('#rollDesc').textContent = d.d;
  $('#rollMeta').innerHTML =
    '<span' + (d.light ? ' class="g"' : '') + '>' + d.k + ' kcal</span>' +
    '<span>' + d.t + ' 分钟</span>' +
    '<span>' + d.f + '</span>' +
    '<span>' + d.lv + '</span>';
  $('#rollTake').disabled = false;
}

function closeRoll(){
  clearTimeout(rollTimer);
  rolling = false;
  $('#rollWrap').classList.remove('show');
  document.body.classList.remove('lock');
}

/* ---------- events ---------- */
$('#list').addEventListener('click', function(e){
  var add = e.target.closest('[data-add]');
  if(add){
    e.stopPropagation();
    toggleSelect(Number(add.getAttribute('data-add')));
    return;
  }
  var toggle = e.target.closest('[data-toggle]');
  if(toggle){
    var id = Number(toggle.getAttribute('data-toggle'));
    var card = $('.dish[data-id="' + id + '"]');
    if(!card) return;
    var isOpen = card.classList.toggle('open');
    if(isOpen){
      expanded.add(id);
      setTimeout(function(){
        var r = card.getBoundingClientRect();
        var limit = window.innerHeight - 92;
        if(r.bottom > limit){
          window.scrollBy({top: r.bottom - limit + 8, behavior:'smooth'});
        }
      }, 330);
    }else{
      expanded.delete(id);
    }
  }
});

$('#catRow').addEventListener('click', function(e){
  var btn = e.target.closest('[data-cat]');
  if(!btn) return;
  filter.cat = btn.getAttribute('data-cat');
  $$('#catRow .chip').forEach(function(b){ b.classList.toggle('on', b === btn); });
  renderList();
});

$('#filterRow').addEventListener('click', function(e){
  var btn = e.target.closest('.chip');
  if(!btn) return;
  var f = btn.getAttribute('data-filter');
  var t = btn.getAttribute('data-time');
  if(f === 'light'){
    filter.light = !filter.light;
    btn.classList.toggle('on', filter.light);
  }else if(f === 'quick'){
    filter.quick = !filter.quick;
    btn.classList.toggle('on', filter.quick);
  }else if(t){
    filter.time = t;
    $$('#filterRow [data-time]').forEach(function(b){ b.classList.toggle('on', b === btn); });
  }
  renderList();
});

let qTimer;
$('#q').addEventListener('input', function(e){
  var val = e.target.value;
  $('#clearQ').classList.toggle('show', !!val);
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    filter.q = val.trim();
    renderList();
  }, 120);
});

$('#clearQ').addEventListener('click', function(){
  $('#q').value = '';
  $('#clearQ').classList.remove('show');
  filter.q = '';
  renderList();
  $('#q').focus();
});

$('#themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  var meta = $('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', next === 'dark' ? '#171412' : '#faf6f0');
});

$('#openSheet').addEventListener('click', openSheet);
$('#closeSheet').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);

$('#sheetList').addEventListener('click', function(e){
  var rm = e.target.closest('[data-rm]');
  if(!rm) return;
  var id = Number(rm.getAttribute('data-rm'));
  var i = selected.indexOf(id);
  if(i !== -1){ selected.splice(i, 1); saveSelected(); }
  syncCard(id);
  renderSheet();
  updateSelHint();
  updateDock();
  if(!selected.length) toast('菜单清空了');
});

$('#clearAll').addEventListener('click', function(){
  if(!selected.length){ toast('还没有选菜'); return; }
  selected = [];
  saveSelected();
  $$('.dish').forEach(function(el){
    var id = Number(el.getAttribute('data-id'));
    syncCard(id);
  });
  renderSheet();
  updateSelHint();
  updateDock();
  toast('已清空');
});

function showCopyFallback(){
  $('#copyArea').value = menuText();
  $('#copyWrap').classList.add('show');
  document.body.classList.add('lock');
  setTimeout(function(){
    var area = $('#copyArea');
    area.focus();
    area.select();
  }, 120);
}

function hideCopyFallback(){
  $('#copyWrap').classList.remove('show');
  if(!$('#sheet').classList.contains('show') && !$('#rollWrap').classList.contains('show')){
    document.body.classList.remove('lock');
  }
}

$('#copyBtn').addEventListener('click', function(){
  if(!selected.length){ toast('先选几道菜'); return; }
  copyText(menuText()).then(function(){
    toast('菜单已复制，发给 TA 吧');
  }).catch(function(){
    showCopyFallback();
  });
});

$('#copyClose').addEventListener('click', hideCopyFallback);
$('#copyWrap').addEventListener('click', function(e){ if(e.target === this) hideCopyFallback(); });
$('#copyRetry').addEventListener('click', function(){
  copyText(menuText()).then(function(){
    hideCopyFallback();
    toast('菜单已复制，发给 TA 吧');
  }).catch(function(){
    toast('还是不行，长按文字手动复制');
    var area = $('#copyArea');
    area.focus(); area.select();
  });
});

$('#pickBtn').addEventListener('click', openRoll);
$('#rollClose').addEventListener('click', closeRoll);
$('#rollWrap').addEventListener('click', function(e){ if(e.target === this) closeRoll(); });
$('#rollAgain').addEventListener('click', function(){
  if(rolling) return;
  $('#rollCard').classList.remove('reveal');
  $('#rollName').classList.add('rolling');
  $('#rollDesc').textContent = '再翻一次……';
  $('#rollMeta').innerHTML = '';
  $('#rollTake').disabled = true;
  rolling = true;
  runRoll();
});
$('#rollTake').addEventListener('click', function(){
  if(!rollDish) return;
  if(!isSelected(rollDish.id)) toggleSelect(rollDish.id);
  closeRoll();
  toast('已加入今晚菜单 · ' + rollDish.n);
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if($('#copyWrap').classList.contains('show')) hideCopyFallback();
    else if($('#rollWrap').classList.contains('show')) closeRoll();
    else if($('#sheet').classList.contains('show')) closeSheet();
  }
});

window.addEventListener('scroll', function(){
  $('#toolbar').classList.toggle('stuck', window.scrollY > 6);
}, {passive:true});

/* ---------- init ---------- */
$('#totalNum').textContent = DISHES.length;
updateDock();
renderList();
</script>
</body>
</html>
